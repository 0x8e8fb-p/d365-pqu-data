[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d365-pqu-data"
version = "1.0.0"
description = "Machine-readable dataset of Microsoft Dynamics 365 Finance and Operations proactive quality updates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "d365-pqu-data contributors" }]
keywords = ["dynamics-365", "finance-and-operations", "pqu", "dataset", "github-pages"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "markdown-it-py>=3.0,<5",
    "jsonschema>=4.22,<5",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-jsonschema",
    "types-openpyxl",
    "pip-audit>=2.7,<3",
    "build>=1.2,<2",
    "pip-tools>=7.4,<8",
]

[project.scripts]
d365-pqu = "d365_pqu.cli:main"

[project.urls]
Homepage = "https://github.com/0x8e8fb-p/d365-pqu-data"
Source = "https://github.com/0x8e8fb-p/d365-pqu-data"
Dataset = "https://0x8e8fb-p.github.io/d365-pqu-data/"
Original = "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/get-started/quality-updates-schedule"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d365_pqu = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:d365_pqu.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/d365_pqu"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
