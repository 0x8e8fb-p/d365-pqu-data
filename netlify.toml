# Netlify deployment of the published static site.
# Renders build/site from the committed dataset; no sync, no data changes, no network
# calls to Microsoft. GitHub Pages and .github/workflows/update-pqu.yml are untouched.
# The one exception is /api/health.json, proxied to Pages below: the committed health
# document records the last DATA change, not the last CHECK, so a static mirror would
# keep showing a stale "Last check" while the daily check is in fact running on Pages.

[build]
  command = "bash scripts/build-static.sh"
  publish = "build/site"

# Deliberately no PYTHON_VERSION (and no .python-version / .tool-versions / mise.toml).
# A floating "3.12" pin makes Netlify's mise download a python-build-standalone tarball
# from GitHub releases on every deploy; when that download fails, the deploy dies in the
# "Installing dependencies" stage before this repo's build command runs. The image's own
# python3 installs requirements/runtime.lock and runs build-site without issue, so the
# static build has no interpreter-download dependency. Verified locally on Python 3.13.

# Serve the same check status as the canonical GitHub Pages site. force = true is required:
# build-static.sh publishes a static api/health.json, which would otherwise shadow this rule.
# The browser still requests a same-origin path, so the page's CSP (connect-src 'self') holds.
[[redirects]]
  from = "/api/health.json"
  to = "https://0x8e8fb-p.github.io/d365-pqu-data/api/health.json"
  status = 200
  force = true

# 404.html uses GitHub Pages' /d365-pqu-data/ prefix for its stylesheet, icon and links.
# At a Netlify root domain those paths have to resolve to the site root instead.
[[redirects]]
  from = "/d365-pqu-data"
  to = "/"
  status = 200
  force = true

[[redirects]]
  from = "/d365-pqu-data/*"
  to = "/:splat"
  status = 200
  force = true

# Netlify serves 404.html from the publish directory for every other missing path.
