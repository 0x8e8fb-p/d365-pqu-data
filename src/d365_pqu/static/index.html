<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' '__INLINE_SCRIPT_HASHES__'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D365 PQU Tracker</title>
  <meta name="description" content="Microsoft's proactive quality update (PQU) schedule for Dynamics 365 Finance and Operations: trains, station windows, maintenance windows and service update dates, published as JSON, CSV and Excel from one validated dataset.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171717">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="mask-icon" href="./assets/icon.svg" color="#171717">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="alternate" type="application/atom+xml" title="PQU changes (Atom feed)" href="./feed.xml">
  <script>
    try {
      var theme = window.localStorage.getItem("d365-pqu-theme");
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    } catch (error) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="site-name" href="#/">
        <svg class="site-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path class="mark-line" d="M11 32 H53" stroke-width="5" stroke-linecap="round"/>
          <path class="mark-done" d="M2 32a9 9 0 1 0 18 0a9 9 0 1 0 -18 0Z"/>
          <path class="mark-now" d="M23 32a9 9 0 1 0 18 0a9 9 0 1 0 -18 0Z"/>
          <path class="mark-next" d="M45.5 32a7.5 7.5 0 1 0 15 0a7.5 7.5 0 1 0 -15 0Z" stroke-width="3"/>
        </svg>
        <span>D365 PQU Tracker</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <div class="tabs-list" id="tabs"></div>
      </nav>
      <div class="header-tools">
        <div class="health">
          <button id="health-toggle" class="sync" type="button" aria-expanded="false" aria-controls="health-panel" data-state="loading">
            <span id="sync-label">Loading…</span>
            <time id="sync-time"></time>
          </button>
          <div id="health-panel" class="health-panel" hidden></div>
          <p id="health-status" class="visually-hidden" role="status" aria-live="polite"></p>
        </div>
        <label class="zone-field" title="Time zone used for today and for times">
          <span class="zone-label">Time zone</span>
          <select id="zone-select"></select>
        </label>
        <a class="header-excel" href="./downloads/D365-PQU-Tracker.xlsx" download>Download Excel</a>
      </div>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <p id="load-error" class="alert-error" hidden></p>
    <p id="app-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <div id="view"></div>

    <noscript>
      <h1>D365 PQU Tracker</h1>
      <p>This page needs JavaScript. The data is also published as files: the <a href="./downloads/D365-PQU-Tracker.xlsx">Excel workbook</a> and the <a href="./api/index.json">API index</a>.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p class="footer-links"><a id="data-link" href="#/data">Data &amp; API</a> · <a href="./downloads/D365-PQU-Tracker.xlsx">Excel workbook</a> · <a href="./feed.xml">Atom feed</a> · <a href="https://github.com/0x8e8fb-p/d365-pqu-data">Source repository</a></p>
      <div class="footer-prefs">
        <label class="theme-field">Theme
          <select id="theme-select">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <span class="footer-credit">0x8e8fb</span>
      </div>
    </div>
  </footer>

  <script src="./assets/app.js" defer></script>
</body>
</html>
