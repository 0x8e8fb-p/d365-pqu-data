name: Update D365 PQU dataset

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pqu-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      status: ${{ steps.sync.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime.lock
          python -m pip install -r requirements/dev.lock
          python -m pip install -e . --no-deps

      - name: Validate project before network sync
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q

      - name: Synchronize Microsoft source
        id: sync
        run: |
          python -m d365_pqu sync --build-site --github-output "$GITHUB_OUTPUT"

      - name: Verify generated artifacts before commit
        if: steps.sync.outputs.changed == 'true'
        run: python -m d365_pqu verify

      - name: Commit generated dataset
        id: commit
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data excel
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: synchronize D365 PQU schedule from Microsoft"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push verified dataset commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin HEAD:main; then
            git fetch --no-tags --depth=1 origin main
            git rebase FETCH_HEAD
            git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin HEAD:main
          fi

      - name: Verify committed artifacts
        run: python -m d365_pqu verify

      - name: Rebuild site from committed data
        run: python -m d365_pqu build-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          retention-days: 3

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Close recovered sync issue
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = "automation";
            const managedTitle = "[Automation] D365 PQU sync failed";
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 10,
            });
            for (const issue of open.data) {
              if (issue.title !== managedTitle) {
                continue;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Recovered: the D365 PQU sync completed successfully. Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

  notify-failure:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update a deduplicated sync issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = "automation";
            const title = "[Automation] D365 PQU sync failed";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled D365 PQU synchronization did not publish any changes.",
              "",
              `- Run: ${runUrl}`,
              `- Ref: ${context.ref}`,
              `- SHA: ${context.sha}`,
              "",
              "Published data was preserved. Review the failed run, then re-run the workflow with **Run workflow**.",
            ].join("\n");
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "b5651d",
                  description: "Managed by the D365 PQU automation",
                });
              } else {
                throw error;
              }
            }
            const open = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 10,
            });
            const managed = open.data.filter((issue) => issue.title === title);
            if (managed.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: managed[0].number,
                body,
              });
              core.notice(`Updated existing sync issue #${managed[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
              core.notice(`Created sync issue #${created.data.number}`);
            }
