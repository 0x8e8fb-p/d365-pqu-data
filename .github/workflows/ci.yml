name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime.lock
          python -m pip install -r requirements/dev.lock
          python -m pip install -e . --no-deps

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Unit, JavaScript, and browser tests
        env:
          REQUIRE_NODE: "1"
          REQUIRE_E2E: "1"
        run: pytest --cov=d365_pqu --cov-report=term-missing

      - name: Verify committed dataset artifacts
        run: python -m d365_pqu verify

      - name: Dependency audit
        run: pip-audit -r requirements/runtime.lock

      - name: Build package
        run: python -m build
